# Alembic configuration for CloudCart database migrations.
#
# The database URL is not stored here. alembic/env.py reads it from
# CLOUDCART_DATABASE_URL through cloudcart.config.Settings, exactly like the
# API and worker. Run from any directory, for example:
#   CLOUDCART_DATABASE_URL=... uv run --project services/backend \
#     alembic -c services/backend/alembic.ini upgrade head

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
