[project]
name = "cloudcart"
version = "0.1.0"
description = "CloudCart backend: FastAPI API and Celery worker sharing one Python package."
readme = "README.md"
# One CPython minor, matching the python:3.15-slim base image recorded in
# deploy/platform/versions.yaml.
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
