[project]
name = "cloudcart"
version = "0.1.0"
description = "CloudCart backend: FastAPI API and Celery worker sharing one Python package."
readme = "README.md"
# One CPython minor: 3.13 is the newest minor that every planned dependency,
# including Celery and Kombu, declares support for. It matches the pinned
# python:3.13.17-slim-trixie base image recorded in deploy/platform/versions.yaml.
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
