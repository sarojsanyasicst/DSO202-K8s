# CloudCart version matrix (machine-readable; read by later preflight checks).
#
# Every entry records the exact version, ARM64 availability and how it was
# verified, an official source, a compatibility note, the check date, and a
# status:
#   verified            - confirmed from a primary source (release notes, registry
#                         manifest, package index) on the check date.
#   partially_verified  - version and ARM64 availability confirmed from a primary
#                         source, but at least one compatibility dimension is not;
#                         each such dimension is named by a `<dimension>_status:
#                         unverified` key in the entry.
#   unverified          - not confirmed from a primary source; do not rely on it
#                         until a later task checks it.
# "Selected" is not "proven on the cluster": installing and exercising these
# components on the M4 kind cluster happens in later milestones.
#
# Image digests are the multi-architecture index digests observed on the check
# date. Tags such as postgres:18.6-trixie are rebuilt upstream, so pin the
# digest wherever byte-for-byte reproducibility matters.

schema_version: 1
checked: "2026-10-23"
timezone: Asia/Thimphu

host_observed:
  machine: Apple M4, arm64, 24 GiB RAM, macOS 26.6.2
  docker_vm: Docker Desktop 29.5.3, 7.75 GiB memory (8321232896 bytes), 12 CPUs, cgroup v2
  note: Below the design's 12-14 GiB planning estimate; see docs/instructor/prerequisites.md.

python:
  runtime:
    version: "3.13"
    patch: "3.13.17"
    image: python:3.13.17-slim-trixie
    image_index_digest: sha256:fe14fd57a4c0361110eaa0c284112b189750bcb43fb04bb5d1ee7b7744027ccf
    arm64:
      available: true
      verified_by: >-
        Registry manifest index for python:3.13.17-slim-trixie (queried from registry-1.docker.io,
        not pulled) lists linux/arm64/v8; digest matches the Docker Hub tag API.
    source: https://www.python.org/downloads/release/python-31317/
    reason: >-
      Newest CPython minor that every planned Python dependency declares support for: Celery 5.6.3
      and Kombu 5.6.2 (classifiers stop at 3.13) gate it. Every locked compiled dependency publishes
      cp313 macOS arm64 and manylinux aarch64 wheels (see backend_libraries). Also avoids running
      tests on a release-candidate interpreter.
    compatibility: >-
      pyproject.toml pins requires-python ">=3.13,<3.14". 3.13 receives security fixes until
      2029-10-31 (bugfix phase ended 2026-10-01). uv 0.12.17 (observed) provisions at most
      CPython 3.13.15 locally; the image carries 3.13.17. Patch-level differences are not
      expected to matter but local runs and the image are not byte-identical.
    local_test_interpreter: CPython 3.13.15 (uv-managed)
    rejected_alternatives:
      "3.15":
        candidate: CPython 3.15.1, image python:3.15.1-slim-trixie (index sha256:08275f764e022331c6d3e3ca55d8cce01fa4684b02111adf0445d71806fe7941)
        reason: >-
          Locked wheels exist, but Celery/Kombu do not declare 3.15 support, and uv 0.12.17 can only
          provision the 3.15.0rc2 release candidate, which does not match the release image.
      "3.14":
        candidate: CPython 3.14.9, image python:3.14.9-slim-trixie (index sha256:b347e2dcbc7f0b6f9fb7182e9da6a187fb10ae715e0692518c1aed0eec94a700)
        reason: >-
          Locked wheels exist, but Celery 5.6.3 and Kombu 5.6.2 declare support only up to 3.13;
          only the Celery 5.7.0rc1 pre-release declares 3.14.
    checked: "2026-10-23"
    status: verified

